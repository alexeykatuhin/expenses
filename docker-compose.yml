services:
  postgres:
    image: postgres:16-alpine
    container_name: family-expenses-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_expenses
      POSTGRES_USER: family_expenses
      POSTGRES_PASSWORD: family_expenses
    ports:
      - "5432:5432"
    volumes:
      - family-expenses-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_expenses -d family_expenses"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  family-expenses-postgres-data:
